<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 160 160" width="160" height="160" role="img" aria-label="宏图手卷">
<title>宏图手卷</title>
<style>/* style:start */
.f-sheet{fill:var(--sheet,#F8F7F2)}
.f-paper{fill:var(--paper,#ECEAE1)}
.f-line{fill:var(--line,#D6D2C4)}
.f-ink{fill:var(--ink,#24231F)}
.f-ink2{fill:var(--ink-2,#4E4C45)}
.f-ink3{fill:var(--ink-3,#6B685F)}
.f-indigo{fill:var(--indigo,#1F3A4D)}
.f-indigo2{fill:var(--indigo-2,#2B4D65)}
.f-gold{fill:var(--gold,#D9B865)}
.f-brass{fill:var(--brass,#85682F)}
.f-wood{fill:var(--wood,#6B4A2B)}
.f-cinnabar{fill:var(--cinnabar,#B5382A)}
.o{stroke:var(--ink,#24231F);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.k-ink,.k-ink3,.k-line,.k-sheet,.k-gold,.k-brass,.k-wood,.k-indigo2{fill:none;stroke-linecap:round;stroke-linejoin:round}
.k-ink{stroke:var(--ink,#24231F)}
.k-ink3{stroke:var(--ink-3,#6B685F)}
.k-line{stroke:var(--line,#D6D2C4)}
.k-sheet{stroke:var(--sheet,#F8F7F2)}
.k-gold{stroke:var(--gold,#D9B865)}
.k-brass{stroke:var(--brass,#85682F)}
.k-wood{stroke:var(--wood,#6B4A2B)}
.k-indigo2{stroke:var(--indigo-2,#2B4D65)}
/* style:end */</style>
<!-- 画心 -->
<path class="f-sheet o" d="M-62-33C-30-38 30-29 62-35V31C30 37-30 28-62 33z"/>
<path class="k-brass" stroke-width="1.3" d="M-55-26C-26-30 26-22 55-28V24C26 30-26 22-55 26z"/>
<!-- 远山 -->
<path class="f-indigo2" d="M-50 20-33-5-24 4-7-21 9-1 17-9 35 19C12 23-27 16-50 20z"/>
<path class="f-indigo" d="M7 21 26 1 43 20C33 22 18 22 7 21z"/>
<path class="k-sheet" stroke-width="1.6" d="M-7-21-12-11M-33-5-36 0M26 1 22 7"/>
<!-- 山顶的旗 -->
<path class="k-ink" stroke-width="1.6" d="M-7-21V-35"/>
<path class="f-gold" d="M-7-35 4-31.5-7-28z"/>
<!-- 盘山路：只画了一半的虚线 -->
<path class="k-ink" stroke-width="1.8" stroke-dasharray="4 4.5" d="M-50 26C-34 30-28 12-12 14S16 26 27 11 42-12 52-20"/>
<!-- 轴杆和轴头 -->
<rect class="f-wood o" x="-71" y="-42" width="10" height="84" rx="3"/>
<rect class="f-wood o" x="61" y="-44" width="10" height="84" rx="3"/>
<path class="f-gold o" d="M-69-50h6v8h-6zM-69 42h6v8h-6zM63-52h6v8h-6zM63 40h6v8h-6z"/>
</svg>
