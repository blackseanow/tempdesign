<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 160 160" width="160" height="160" role="img" aria-label="火箭">
<title>火箭</title>
<style>/* style:start */
.f-sheet{fill:var(--sheet,#F8F7F2)}
.f-paper{fill:var(--paper,#ECEAE1)}
.f-line{fill:var(--line,#D6D2C4)}
.f-ink{fill:var(--ink,#24231F)}
.f-ink2{fill:var(--ink-2,#4E4C45)}
.f-ink3{fill:var(--ink-3,#6B685F)}
.f-indigo{fill:var(--indigo,#1F3A4D)}
.f-indigo2{fill:var(--indigo-2,#2B4D65)}
.f-gold{fill:var(--gold,#D9B865)}
.f-brass{fill:var(--brass,#85682F)}
.f-wood{fill:var(--wood,#6B4A2B)}
.f-cinnabar{fill:var(--cinnabar,#B5382A)}
.o{stroke:var(--ink,#24231F);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.k-ink,.k-ink3,.k-line,.k-sheet,.k-gold,.k-brass,.k-wood,.k-indigo2{fill:none;stroke-linecap:round;stroke-linejoin:round}
.k-ink{stroke:var(--ink,#24231F)}
.k-ink3{stroke:var(--ink-3,#6B685F)}
.k-line{stroke:var(--line,#D6D2C4)}
.k-sheet{stroke:var(--sheet,#F8F7F2)}
.k-gold{stroke:var(--gold,#D9B865)}
.k-brass{stroke:var(--brass,#85682F)}
.k-wood{stroke:var(--wood,#6B4A2B)}
.k-indigo2{stroke:var(--indigo-2,#2B4D65)}
/* style:end */</style>
<!-- 尾焰：class="flame" 由动效脚本伸缩 -->
<g class="flame">
<path class="f-gold" d="M-12 42C-15 56-4 64 0 78 4 64 15 56 12 42z"/>
<path class="f-sheet" d="M-6 42C-7 51-2 56 0 66 2 56 7 51 6 42z"/>
</g>
<!-- 尾翼 -->
<path class="f-indigo o" d="M-17 12C-31 21-35 34-33 46L-15 37zM17 12C31 21 35 34 33 46L15 37z"/>
<!-- 箭身 -->
<path class="f-sheet o" d="M0-68C16-52 22-26 20 4 19 20 16 33 14 41H-14C-16 33-19 20-20 4-22-26-16-52 0-68z"/>
<path class="f-line" d="M10-50C18-30 19 0 17 20 16 30 14.5 36 13 40H8C10 30 12 10 11-12 10-28 8.5-40 4-55z"/>
<!-- 箭头 -->
<path class="f-brass o" d="M0-68C8-60 12.5-53 15.5-45H-15.5C-12.5-53-8-60 0-68z"/>
<!-- 舷窗 -->
<circle class="f-sheet o" cx="0" cy="-17" r="12"/>
<circle class="f-indigo" cx="0" cy="-17" r="8.2"/>
<path class="k-sheet" stroke-width="2" opacity=".8" d="M-4.5-20.5a5.6 5.6 0 0 1 5-2.4"/>
<!-- 腰带和中间的尾翼 -->
<path class="k-indigo2" stroke-width="3" d="M-19 13H19"/>
<path class="f-indigo o" d="M-3.5 26h7v20h-7z"/>
<!-- 喷口 -->
<path class="f-ink2 o" d="M-11 40h22l-3 5h-16z"/>
</svg>
