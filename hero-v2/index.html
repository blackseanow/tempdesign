<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>咸鱼把脉了 招牌插画 v2</title>
<!-- 由 tools/build.py 从 src/ 生成，不要手改 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root{
  --paper:#ECEAE1;--sheet:#F8F7F2;--ink:#24231F;--ink-2:#4E4C45;--ink-3:#6B685F;
  --line:#D6D2C4;--line-2:#E4E0D4;
  --indigo:#1F3A4D;--indigo-2:#2B4D65;--cinnabar:#B5382A;--brass:#85682F;
  --velvet:#A72F24;--gold:#D9B865;--wood:#6B4A2B;
  --kai:"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif;
  --song:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--song);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}

/* hero-signboard:start（到 end 之间的样式由 tools/build.py 原样复制进 HeroSignboard.vue） */
/* ---------- 招牌：牌匾和标语在上，插画在下 ----------
   新图中间上方是道具飞过的路线，牌匾不再压在画上。类名都带 hero- 前缀，不和全站的 .plaque 冲突。 */
.hero-signboard{max-width:1920px;margin:0 auto;container-type:inline-size}
.hero-sign{display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(22px,2.4cqi,44px) 16px clamp(14px,1.5cqi,26px)}
.hero-plaque{display:inline-block;margin:0;padding:.41em 1.18em;background:var(--indigo,#1F3A4D);color:#F4F2EA;font-family:var(--kai,"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif);font-weight:400;font-size:clamp(24px,2.1cqi,40px);line-height:1.7;white-space:nowrap;box-shadow:inset 0 0 0 5px var(--indigo,#1F3A4D),inset 0 0 0 6px #C9A86A}
.hero-plaque span{letter-spacing:.35em;margin-right:-.35em}
.hero-motto{margin:.8em 0 0;font-family:var(--kai,"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif);font-size:clamp(15px,1.1cqi,21px);line-height:1.8;letter-spacing:.12em;color:var(--ink-2,#4E4C45)}
.hero-motto span{display:inline-block;margin:0 .4em}

/* ---------- 插画：三层叠在同一个 1916 × 821 的框里 ---------- */
.hero-stage{position:relative;aspect-ratio:1916/821;overflow:hidden;background:var(--paper,#ECEAE1)}
.hero-stage picture,.hero-stage img{position:absolute;inset:0;display:block;width:100%;height:100%}
.hero-after{opacity:0}
.hero-fx{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.hero-replay{position:absolute;padding:0;border:0;border-radius:14px;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero-replay:focus-visible{outline:2px solid var(--brass,#85682F);outline-offset:2px}

/* 声浪：只用设计系统的颜色 */
.hero-fx .fx-waves path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hero-fx .w-ink2{stroke:var(--ink-2,#4E4C45)}
.hero-fx .w-ink3{stroke:var(--ink-3,#6B685F)}
.hero-fx .w-brass{stroke:var(--brass,#85682F)}
.hero-fx .w-gold{stroke:var(--gold,#D9B865)}
/* 录音笔周围的波纹：平时不显示，收住时亮一下；鼠标移到录音笔上时淡淡亮起，提示可以点 */
.hero-fx .fx-ripple{fill:none;stroke:var(--gold,#D9B865);stroke-width:2.6;opacity:0;transform-box:fill-box;transform-origin:center}
.hero-stage.is-hot .fx-ripple{opacity:.55;transition:opacity .25s}
.hero-fx .fx-seal{mix-blend-mode:multiply}

/* 减少动态效果、或者屏幕窄于 768px：<picture> 换成 hero-static，这几层都不要 */
@media (prefers-reduced-motion:reduce),(max-width:767.98px){
  .hero-stage .hero-after,.hero-stage .hero-fx,.hero-stage .hero-replay{display:none}
}
@media (max-width:600px){
  .hero-motto span{display:block}
}

/* 道具和印章的配色（props/_style.css） */
.hero-fx .f-sheet{fill:var(--sheet,#F8F7F2)}
.hero-fx .f-paper{fill:var(--paper,#ECEAE1)}
.hero-fx .f-line{fill:var(--line,#D6D2C4)}
.hero-fx .f-ink{fill:var(--ink,#24231F)}
.hero-fx .f-ink2{fill:var(--ink-2,#4E4C45)}
.hero-fx .f-ink3{fill:var(--ink-3,#6B685F)}
.hero-fx .f-indigo{fill:var(--indigo,#1F3A4D)}
.hero-fx .f-indigo2{fill:var(--indigo-2,#2B4D65)}
.hero-fx .f-gold{fill:var(--gold,#D9B865)}
.hero-fx .f-brass{fill:var(--brass,#85682F)}
.hero-fx .f-wood{fill:var(--wood,#6B4A2B)}
.hero-fx .f-cinnabar{fill:var(--cinnabar,#B5382A)}
.hero-fx .o{stroke:var(--ink,#24231F);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.hero-fx .k-ink,.hero-fx .k-ink3,.hero-fx .k-line,.hero-fx .k-sheet,.hero-fx .k-gold,.hero-fx .k-brass,.hero-fx .k-wood,.hero-fx .k-indigo2{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hero-fx .k-ink{stroke:var(--ink,#24231F)}
.hero-fx .k-ink3{stroke:var(--ink-3,#6B685F)}
.hero-fx .k-line{stroke:var(--line,#D6D2C4)}
.hero-fx .k-sheet{stroke:var(--sheet,#F8F7F2)}
.hero-fx .k-gold{stroke:var(--gold,#D9B865)}
.hero-fx .k-brass{stroke:var(--brass,#85682F)}
.hero-fx .k-wood{stroke:var(--wood,#6B4A2B)}
.hero-fx .k-indigo2{stroke:var(--indigo-2,#2B4D65)}
/* hero-signboard:end */

/* ---------- ?debug=1 才用到 ---------- */
.hero-debug{position:absolute;inset:0;pointer-events:none}
.hero-debug-ref,.hero-debug-guides{position:absolute;inset:0;width:100%;height:100%}
.hero-debug-guides{fill:none;stroke:var(--indigo-2);stroke-width:2;stroke-dasharray:8 6}
.hero-debug-guides .hd-mic{fill:var(--sheet);stroke-dasharray:none}
.hero-debug-guides .hd-seal{stroke:var(--brass);stroke-width:3}
.hero-debug-on .hero-replay{outline:2px dashed var(--brass);outline-offset:0}
.hero-debug-pin{position:absolute;pointer-events:auto;width:26px;height:26px;margin:-13px 0 0 -13px;padding:0;border:2px solid var(--sheet);border-radius:50%;background:var(--indigo);box-shadow:0 0 0 2px var(--indigo);cursor:grab;touch-action:none}
.hero-debug-pin:active{cursor:grabbing}
.hero-debug-pin i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--sheet)}
.hero-debug-pin span{position:absolute;left:20px;top:-26px;padding:1px 6px;white-space:nowrap;font:12px/1.6 var(--song);color:var(--sheet);background:var(--indigo)}
.hero-debug-pin[data-key=stack] span{left:auto;right:20px}
.hero-debug-panel{max-width:1920px;margin:0 auto;padding:14px 16px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 32px;font-size:13px;line-height:1.6;background:var(--sheet);border-top:1px solid var(--line)}
.hero-debug-panel>section{min-width:0}
.hero-debug-panel h2{margin:0 0 4px;font-family:var(--kai);font-weight:400;font-size:18px}
.hero-debug-panel p{margin:4px 0;color:var(--ink-2)}
.hero-debug-panel table{width:100%;border-collapse:collapse;margin:6px 0}
.hero-debug-panel th{text-align:left;font-weight:400;color:var(--ink-3)}
.hero-debug-panel input[type=number]{width:76px}
.hero-debug-panel .hd-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0}
.hero-debug-panel input[type=range]{flex:1}
.hero-debug-panel textarea{width:100%;font:12px/1.5 ui-monospace,monospace}
.hero-debug-panel .hd-msg{color:var(--brass)}
</style>

const HERO_ANCHORS = {"说明": "x、y 是占图片宽、高的百分比（0–100），原点在左上角。打开 index.html?debug=1 拖动标记微调，再把面板里的 JSON 贴回这里。", "mouth": {"label": "领导嘴边", "x": 14.61, "y": 43.36}, "recorder": {"label": "录音笔", "x": 48.17, "y": 74.54}, "notebook": {"label": "员工的笔记本", "x": 77.14, "y": 78.93}, "stack": {"label": "员工面前那摞材料", "x": 73.33, "y": 76.25}};
/* 招牌动效：把脉前（0–4 秒）→ 收住（4–6 秒）→ 把脉后（6–8 秒），播一次停在“把脉后”，点录音笔重播。
   画面只由时间 t（秒）决定：render(t) 不依赖上一帧，所以调试面板能拖时间轴，截图能定格在任意一刻。
   坐标是插画的 viewBox（1916 × 821），锚点从 anchors.json 的百分比换算过来。 */
function createHeroMotion(stage, anchors, opts = {}) {
  const W = 1916, H = 821, NS = 'http://www.w3.org/2000/svg'
  const END = 8, GATHER = 4, AFTER = 6, PREROLL = 0.45
  const STATIC_QUERY = '(prefers-reduced-motion: reduce), (max-width: 767.98px)'
  // 声浪中线的形状：从嘴边到笔记本的拱。每个点是 [沿“嘴边 → 笔记本”的比例, 往上抬多少（占图高）]
  const ARCH = [[0, 0], [0.227, 0.197], [0.533, 0.415], [0.797, 0.447], [0.921, 0.289], [0.963, 0.084], [1, 0]]
  const STEP = 9            // 声浪采样间距
  const PROP_PX = 150       // 道具放大到 1 倍时的边长（道具 SVG 统一成 160 单位见方）
  // 六样道具：出场顺序、离中线的偏移、翻滚圈数；火箭不翻滚，机头一直朝上
  const PROPS = [
    { id: 'mask-book', lane: -16, spin: 0.55, tilt: -14 },
    { id: 'scroll', lane: 14, spin: -0.5, tilt: 8 },
    { id: 'pie', lane: -10, spin: 0.65, tilt: -6 },
    { id: 'soup', lane: 16, spin: -0.55, tilt: 10 },
    { id: 'go-board', lane: -14, spin: 0.5, tilt: -8 },
    { id: 'rocket', lane: 10, upright: true },
  ]
  const LAUNCH0 = 0.35, LAUNCH_GAP = 0.6, FLIGHT = 1.65  // 每 0.6 秒放一样，一样飞 1.65 秒：空中同时两三个

  const fx = stage.querySelector('.hero-fx')
  const base = stage.querySelector('.hero-base')
  const after = stage.querySelector('.hero-after')
  const btn = stage.querySelector('.hero-replay')
  const wavesG = fx.querySelector('.fx-waves')
  const ripples = [...fx.querySelectorAll('.fx-ripple')]
  const sealG = fx.querySelector('.fx-seal')
  const props = PROPS.map((p, i) => Object.assign({ i, el: fx.querySelector(`.fx-prop[data-prop="${p.id}"]`) }, p)).filter(p => p.el)
  const flame = fx.querySelector('.fx-prop[data-prop="rocket"] .flame')

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x))
  const lerp = (a, b, f) => a + (b - a) * f
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u) }
  const sine = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u, 0, 1))
  const TAU = Math.PI * 2

  // 声浪：12 道线。前三道从嘴边出来，又细又缓；其余的一路从已有的线上分出来，越往员工那边越多、越乱
  const rnd = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296 })(20261030)
  const COLORS = ['ink3', 'brass', 'ink2', 'gold', 'brass', 'ink3', 'ink2', 'gold', 'brass']
  const LINES = []
  for (let k = 0; k < 12; k++) {
    const first = k < 3
    LINES.push({
      born: first ? 0 : 0.15 + 0.06 * (k - 3) + (rnd() - 0.5) * 0.04,  // 前 15% 只有三道
      parent: first ? -1 : Math.floor(rnd() * k),
      lane: first ? (k - 1) * 0.7 : rnd() * 2 - 1,
      color: first ? ['ink3', 'brass', 'ink3'][k] : COLORS[k - 3],
      width: first ? 1.5 : 1.1 + rnd() * 0.9,
      alpha: first ? 0.85 : 0.5 + rnd() * 0.4,
      ph: [rnd() * TAU, rnd() * TAU, rnd() * TAU],
      sp: 0.85 + rnd() * 0.3,
    })
  }
  const paths = LINES.map(L => {
    const p = document.createElementNS(NS, 'path')
    p.setAttribute('class', 'w-' + L.color)
    p.setAttribute('stroke-width', L.width.toFixed(2))
    wavesG.appendChild(p)
    return p
  })

  let G = null   // 由锚点算出来的几何
  let OFF = []   // 每道线在每个采样点上离中线的偏移
  let PX = new Float32Array(0), PY = new Float32Array(0)

  function catmull(pts, seg) {
    const out = []
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)]
      for (let j = 0; j < seg; j++) {
        const u = j / seg, u2 = u * u, u3 = u2 * u
        out.push({
          x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
          y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3),
        })
      }
    }
    out.push(pts[pts.length - 1])
    return out
  }

  function build(a) {
    const pt = k => ({ x: a[k].x / 100 * W, y: a[k].y / 100 * H })
    const M = pt('mouth'), N = pt('notebook'), R = pt('recorder'), S = pt('stack')
    const way = ARCH.map(([f, h]) => ({ x: lerp(M.x, N.x, f), y: lerp(M.y, N.y, f) - h * H }))
    const dense = catmull(way, 48)
    const cum = [0]
    for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y))
    const len = cum[cum.length - 1]
    const n = Math.max(8, Math.round(len / STEP))
    const xs = new Float32Array(n + 1), ys = new Float32Array(n + 1), nx = new Float32Array(n + 1), ny = new Float32Array(n + 1), phase = new Float32Array(n + 1)
    for (let i = 0, j = 0; i <= n; i++) {
      const d = len * i / n
      while (j < cum.length - 2 && cum[j + 1] < d) j++
      const f = (d - cum[j]) / ((cum[j + 1] - cum[j]) || 1)
      xs[i] = lerp(dense[j].x, dense[j + 1].x, f)
      ys[i] = lerp(dense[j].y, dense[j + 1].y, f)
    }
    for (let i = 0; i <= n; i++) {
      const i0 = Math.max(0, i - 1), i1 = Math.min(n, i + 1)
      const tx = xs[i1] - xs[i0], ty = ys[i1] - ys[i0], l = Math.hypot(tx, ty) || 1
      nx[i] = -ty / l; ny[i] = tx / l
      // 波长从嘴边的 190 缩到笔记本前的 75：越往后起伏越密
      if (i > 0) phase[i] = phase[i - 1] + (len / n) / (190 - 115 * (i / n))
    }
    G = { M, N, R, S, n, len, xs, ys, nx, ny, phase,
      mic: { x: R.x, y: R.y - 0.040 * H },        // 声浪吸进机头
      foot: { x: R.x, y: R.y + 0.047 * H } }      // 波纹画在机身底部的桌面上
    OFF = LINES.map(() => new Float32Array(n + 1))
    PX = new Float32Array(n + 1); PY = new Float32Array(n + 1)
    // 波纹：三圈椭圆，和底图上录音笔脚下的波纹同心
    ripples.forEach((el, i) => {
      const rx = 46 + 27 * i
      el.setAttribute('cx', G.foot.x.toFixed(1)); el.setAttribute('cy', G.foot.y.toFixed(1))
      el.setAttribute('rx', rx); el.setAttribute('ry', (rx * 0.17).toFixed(1))
    })
    // 点录音笔重播：按钮盖住录音笔
    if (btn) Object.assign(btn.style, { left: (a.recorder.x - 2.4) + '%', top: (a.recorder.y - 7.6) + '%', width: '4.8%', height: '15.2%' })
  }

  function sample(s) {
    const f = clamp(s, 0, 1) * G.n, i = Math.min(G.n - 1, Math.floor(f)), u = f - i
    return { x: lerp(G.xs[i], G.xs[i + 1], u), y: lerp(G.ys[i], G.ys[i + 1], u), nx: lerp(G.nx[i], G.nx[i + 1], u), ny: lerp(G.ny[i], G.ny[i + 1], u) }
  }

  function offsets(t) {
    const n = G.n
    const grow = 0.8 + 0.2 * smooth(1, 3.5, t)
    for (let i = 0; i <= n; i++) {
      const s = i / n
      // 越往员工那边散得越开、起伏越大，最后 10% 收进笔记本
      const spread = 4 + (30 + 30 * smooth(0.55, 0.85, s)) * smooth(0, 0.5, s) * (1 - smooth(0.9, 1, s))
      const amp = (2 + 14 * Math.pow(smooth(0.12, 0.8, s), 1.2)) * (1 - smooth(0.92, 1, s)) * grow
      const c2 = 0.55 * smooth(0.25, 0.75, s), c3 = 0.35 * smooth(0.45, 0.9, s)
      const P = G.phase[i] * TAU
      for (let k = 0; k < LINES.length; k++) {
        const L = LINES[k]
        const own = L.lane * spread + amp * (Math.sin(P - TAU * 1.6 * L.sp * t + L.ph[0])
          + c2 * Math.sin(2.3 * P - TAU * 2.1 * L.sp * t + L.ph[1])
          + c3 * Math.sin(3.7 * P - TAU * 2.9 * t + L.ph[2]))
        if (L.parent < 0) OFF[k][i] = own
        else { const p = OFF[L.parent][i]; OFF[k][i] = p + (own - p) * smooth(L.born, L.born + 0.1, s) }
      }
    }
  }

  function pathD(m) {
    let d = 'M' + PX[0].toFixed(1) + ' ' + PY[0].toFixed(1)
    for (let i = 1; i < m - 1; i++) d += 'Q' + PX[i].toFixed(1) + ' ' + PY[i].toFixed(1) + ' ' + ((PX[i] + PX[i + 1]) / 2).toFixed(1) + ' ' + ((PY[i] + PY[i + 1]) / 2).toFixed(1)
    return d + 'L' + PX[m - 1].toFixed(1) + ' ' + PY[m - 1].toFixed(1)
  }

  function drawWaves(t) {
    if (t <= 0 || t >= AFTER) { paths.forEach(p => p.setAttribute('d', '')); return }
    offsets(t)
    const n = G.n, mic = G.mic
    const head = t < 1.8 ? sine(t / 1.8) : 1            // 声浪从嘴边往外走，1.8 秒到笔记本
    const u = (t - GATHER) / (AFTER - GATHER)              // 收住阶段的进度
    for (let k = 0; k < LINES.length; k++) {
      const L = LINES[k], path = paths[k]
      const i0 = Math.ceil(L.born * n), i1 = Math.floor(head * n)
      if (i1 - i0 < 2) { path.setAttribute('d', ''); continue }
      let m = 0
      for (let i = i0; i <= i1; i++) {
        const s = i / n
        const off = OFF[k][i] * smooth(0, 0.05, s)
        let x = G.xs[i] + G.nx[i] * off, y = G.ys[i] + G.ny[i] * off
        if (u > 0) {
          // 掉头：笔记本那头先被拽回来，嘴边那头最后；每一点沿弧线加速吸进机头，起伏一路收平
          const v = clamp((u - 0.04 - 0.52 * (1 - s)) / 0.38, 0, 1), e = v * v
          if (e > 0) {
            const bx = G.xs[i] + G.nx[i] * off * (1 - e), by = G.ys[i] + G.ny[i] * off * (1 - e)
            const cx = mic.x + (bx - mic.x) * 0.55, cy = by + (mic.y - by) * 0.15 - 40
            x = (1 - e) * (1 - e) * bx + 2 * (1 - e) * e * cx + e * e * mic.x
            y = (1 - e) * (1 - e) * by + 2 * (1 - e) * e * cy + e * e * mic.y
          }
        }
        PX[m] = x; PY[m] = y; m++
      }
      path.setAttribute('d', pathD(m))
      path.setAttribute('opacity', (L.alpha * (u > 0 ? 1 - smooth(0.8, 1, u) : 1)).toFixed(3))
    }
  }

  // 道具在把脉前的位置：沿声浪的中线从嘴边飘到笔记本，越近越大，到了笔记本缩进去
  function flight(p, t) {
    const tt = (t - (LAUNCH0 + LAUNCH_GAP * p.i)) / FLIGHT
    if (tt <= 0 || tt >= 1) return null
    const s = 0.05 + 0.935 * sine(tt)
    const c = sample(s)
    const lat = p.lane * smooth(0, 0.2, s) * (1 - smooth(0.9, 1, s)) + 7 * Math.sin(TAU * 1.1 * tt + p.i)
    const scale = (0.32 + 0.93 * smooth(0.02, 0.8, s)) * (1 - 0.85 * smooth(0.86, 1, tt))
    return {
      x: c.x + c.nx * lat, y: c.y + c.ny * lat, scale, tt,
      alpha: smooth(0, 0.08, tt) * (1 - smooth(0.9, 1, tt)),
      rot: p.upright ? 4 * Math.sin(TAU * 1.4 * tt) : p.tilt + 360 * p.spin * tt + 9 * Math.sin(TAU * 0.9 * tt),
      sx: p.upright ? 1 : 0.9 + 0.1 * Math.cos(TAU * 1.3 * p.spin * tt),  // 轻微压扁，像在空中翻面
    }
  }

  // 收住：4 秒时还在空中的道具，依次被吸进录音笔，边转边缩小
  const caught = props.filter(p => { const t0 = LAUNCH0 + LAUNCH_GAP * p.i; return t0 < GATHER && GATHER < t0 + FLIGHT })
  function propState(p, t) {
    if (t <= 0 || t >= AFTER) return null
    if (t < GATHER) return flight(p, t)
    const rank = caught.indexOf(p)
    if (rank < 0) return null
    const c0 = GATHER + 0.12 * rank
    const s0 = flight(p, Math.min(t, c0)) || flight(p, GATHER)
    if (!s0) return null
    const e = Math.pow(clamp((t - c0) / 0.9, 0, 1), 2)
    const mic = G.mic, cx = mic.x + (s0.x - mic.x) * 0.5, cy = s0.y + (mic.y - s0.y) * 0.1 - 60
    return {
      x: (1 - e) * (1 - e) * s0.x + 2 * (1 - e) * e * cx + e * e * mic.x,
      y: (1 - e) * (1 - e) * s0.y + 2 * (1 - e) * e * cy + e * e * mic.y,
      scale: s0.scale * Math.pow(1 - e, 1.3), alpha: s0.alpha * (1 - smooth(0.8, 1, e)),
      rot: p.upright ? s0.rot * (1 - e) : s0.rot + 420 * e * Math.sign(p.spin), sx: s0.sx,
    }
  }

  function drawProps(t) {
    for (const p of props) {
      const st = propState(p, t)
      if (!st || st.alpha <= 0.001 || st.scale <= 0.005) { p.el.setAttribute('opacity', '0'); p.el.removeAttribute('transform'); continue }
      const k = st.scale * PROP_PX / 160
      p.el.setAttribute('transform', `translate(${st.x.toFixed(1)} ${st.y.toFixed(1)}) rotate(${st.rot.toFixed(1)}) scale(${(k * st.sx).toFixed(4)} ${k.toFixed(4)})`)
      p.el.setAttribute('opacity', st.alpha.toFixed(3))
    }
    if (flame) {
      const fy = 0.85 + 0.2 * Math.sin(TAU * 8 * t) + 0.08 * Math.sin(TAU * 13 * t + 1)
      flame.setAttribute('transform', `translate(0 42) scale(1 ${fy.toFixed(3)}) translate(0 -42)`)
    }
  }

  function drawRipples(t) {
    ripples.forEach((el, i) => {
      const x = t - (5.15 + 0.12 * i)
      if (x <= 0 || t >= END) { el.style.opacity = ''; el.style.transform = ''; return }
      const a = x < 0.18 ? x / 0.18 : Math.exp(-(x - 0.18) / 0.35)
      el.style.opacity = (0.95 * a).toFixed(3)
      el.style.transform = `scale(${(0.94 + 0.12 * smooth(0, 0.6, x)).toFixed(3)})`
    })
  }

  // 把脉后：交叉淡入 base-after，朱砂印章盖到那摞材料上（印章贴着纸面，按纸的透视压扁、斜切）
  function drawAfter(t) {
    let a, sealA = 0, k = 1
    if (t < 0) a = rewindFrom * (-t / PREROLL)
    else a = smooth(AFTER, AFTER + 0.8, t)
    const x = t - 6.85
    if (t < 0) { sealA = a; k = 1 }
    else if (x >= 0) {
      if (x < 0.28) { k = 1.75 - 0.75 * Math.pow(x / 0.28, 3); sealA = smooth(0, 0.1, x) }
      else { k = 1 - 0.05 * Math.sin(Math.PI * clamp((x - 0.28) / 0.22, 0, 1)); sealA = 1 }
    }
    after.style.opacity = a.toFixed(3)
    curAfter = a
    sealG.setAttribute('opacity', (0.92 * sealA).toFixed(3))
    sealG.setAttribute('transform', `translate(${G.S.x.toFixed(1)} ${G.S.y.toFixed(1)}) rotate(12) skewX(-30) scale(${(0.88 * k).toFixed(4)} ${(0.5 * k).toFixed(4)})`)
  }

  let t = 0, curAfter = 0, rewindFrom = 0, running = false, raf = 0, last = 0, speed = 1
  let visible = true, played = false, afterReady = false, baseReady = false
  let animated = false, modeSet = false, mq = null, io = null, destroyed = false

  function render(time) {
    t = time
    drawWaves(time); drawProps(time); drawRipples(time); drawAfter(time)
    if (opts.onFrame) opts.onFrame(time)
  }

  function frame(now) {
    raf = 0
    if (!running) return
    const dt = Math.min(0.05, (now - last) / 1000)
    last = now
    t += dt * speed
    if (t >= AFTER && !afterReady) t = AFTER  // base-after 还没下载完就停在这里等
    render(Math.min(t, END))
    if (t >= END) { running = false; stage.classList.remove('is-playing'); if (opts.onEnd) opts.onEnd(); return }
    raf = requestAnimationFrame(frame)
  }

  function play() {
    if (!animated || destroyed) return
    if (t >= END) t = 0
    running = true; played = true
    stage.classList.add('is-playing'); stage.classList.remove('is-hot')
    last = performance.now()
    if (!raf && visible) raf = requestAnimationFrame(frame)
  }
  function pause() { running = false; stage.classList.remove('is-playing'); if (raf) cancelAnimationFrame(raf); raf = 0 }
  function replay() {
    if (!animated) return
    rewindFrom = curAfter
    t = rewindFrom > 0.01 ? -PREROLL : 0
    play()
  }
  // 手动定格或暂停以后，就不再自动开播（比如底图还没下载完时先拖了时间轴）
  function seek(time) { played = true; pause(); render(clamp(time, -PREROLL, END)) }

  function loadAfter() {
    if (!after.getAttribute('src') && after.dataset.src) {
      if (after.dataset.srcset) after.setAttribute('srcset', after.dataset.srcset)
      after.setAttribute('src', after.dataset.src)
    }
    const ok = () => { afterReady = true }  // 下载失败也放行，不让动画卡在 6 秒
    if (after.complete && after.naturalWidth) ok()
    else { after.addEventListener('load', ok, { once: true }); after.addEventListener('error', ok, { once: true }) }
  }

  function tryStart() {
    if (!animated || played || !baseReady || !visible || opts.autoplay === false) return
    play()
  }

  function applyMode() {
    const next = !mq.matches || !!opts.force
    if (next === animated && modeSet) return  // 媒体查询没真变（有的浏览器会多发 change），什么都不做
    animated = next; modeSet = true
    if (animated) {
      loadAfter()
      if (played) { pause(); render(END) } else tryStart()
    } else pause()
  }

  build(anchors)
  render(0)
  mq = window.matchMedia(STATIC_QUERY)
  mq.addEventListener('change', applyMode)
  const onBase = () => { baseReady = !!base.naturalWidth; tryStart() }
  if (base.complete && base.naturalWidth) baseReady = true
  base.addEventListener('load', onBase)
  if ('IntersectionObserver' in window) {
    // 滚出视口：停掉帧循环，时间不走；滚回来接着播
    io = new IntersectionObserver(([e]) => {
      visible = e.isIntersecting
      if (!visible && raf) { cancelAnimationFrame(raf); raf = 0 }
      if (visible && running && !raf) { last = performance.now(); raf = requestAnimationFrame(frame) }
      tryStart()
    })
    io.observe(stage)
  }
  const hotOn = () => { if (!running) stage.classList.add('is-hot') }
  const hotOff = () => stage.classList.remove('is-hot')
  if (btn) {
    btn.addEventListener('click', replay)
    btn.addEventListener('pointerenter', hotOn)
    btn.addEventListener('pointerleave', hotOff)
    btn.addEventListener('focus', hotOn)
    btn.addEventListener('blur', hotOff)
  }
  applyMode()

  return {
    play, replay, seek,
    pause() { played = true; pause() },
    setAnchors(a) { build(a); render(t) },
    setSpeed(v) { speed = v },
    get time() { return t },
    get playing() { return running },
    get animated() { return animated },
    geometry() { return G },
    // 某一时刻空中有哪几样道具（调试和自查用）
    propsInAir(time) { return props.filter(p => { const st = propState(p, time); return st && st.alpha > 0.02 && st.scale > 0.05 }).map(p => p.id) },
    destroy() {
      destroyed = true; pause()
      mq.removeEventListener('change', applyMode)
      base.removeEventListener('load', onBase)
      if (io) io.disconnect()
      if (btn) {
        btn.removeEventListener('click', replay)
        btn.removeEventListener('pointerenter', hotOn); btn.removeEventListener('pointerleave', hotOff)
        btn.removeEventListener('focus', hotOn); btn.removeEventListener('blur', hotOff)
      }
      paths.forEach(p => p.remove())
    },
  }
}
/* ?debug=1：在图上标出四个锚点，拖动（或选中后按方向键）微调，画面实时跟着变；
   面板里能拖时间轴、叠一张参考图，调好以后“复制 JSON”贴回 anchors.json。只在 index.html 里有。 */
function initHeroDebug(stage, motion, anchors, source) {
  const NS = 'http://www.w3.org/2000/svg', W = 1916, H = 821
  const KEYS = ['mouth', 'recorder', 'notebook', 'stack']
  const FOCUS_T = { mouth: 2.6, notebook: 2.6, recorder: 5.3, stack: 8 }
  const NOTE = anchors['说明']
  let a = clone(anchors)
  const round = v => Math.round(v * 100) / 100
  function clone(o) { return JSON.parse(JSON.stringify(o)) }

  stage.classList.add('hero-debug-on')
  const layer = el('div', 'hero-debug')
  const ref = el('img', 'hero-debug-ref')
  ref.alt = ''
  const guides = document.createElementNS(NS, 'svg')
  guides.setAttribute('viewBox', `0 0 ${W} ${H}`)
  guides.setAttribute('class', 'hero-debug-guides')
  layer.append(ref, guides)
  const pins = {}
  for (const k of KEYS) {
    const pin = el('button', 'hero-debug-pin')
    pin.type = 'button'
    pin.dataset.key = k
    pin.innerHTML = '<i></i><span></span>'
    pin.title = '拖动，或选中后按方向键（Shift 加大步长）'
    layer.append(pin)
    pins[k] = pin
    // 点住哪个锚点，就跳到它起作用的那一刻：嘴边、笔记本看把脉前，录音笔看收住，材料看盖好的印章（base-after）
    pin.addEventListener('focus', () => { if (!motion.playing) motion.seek(FOCUS_T[k]) })
    pin.addEventListener('pointerdown', e => {
      if (!motion.playing) motion.seek(FOCUS_T[k])
      pin.setPointerCapture(e.pointerId)
      const move = ev => {
        const r = stage.getBoundingClientRect()
        a[k].x = round(Math.min(100, Math.max(0, (ev.clientX - r.left) / r.width * 100)))
        a[k].y = round(Math.min(100, Math.max(0, (ev.clientY - r.top) / r.height * 100)))
        update()
      }
      const up = () => { pin.removeEventListener('pointermove', move); pin.removeEventListener('pointerup', up) }
      pin.addEventListener('pointermove', move)
      pin.addEventListener('pointerup', up)
      e.preventDefault()
    })
    pin.addEventListener('keydown', e => {
      const step = e.shiftKey ? 0.5 : 0.05
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key]
      if (!d) return
      a[k].x = round(a[k].x + d[0]); a[k].y = round(a[k].y + d[1])
      update(); e.preventDefault()
    })
  }
  stage.append(layer)

  const panel = el('aside', 'hero-debug-panel')
  panel.innerHTML = `
    <section>
      <h2>锚点调试</h2>
      <div class="hd-row hd-time"><button type="button" data-act="play">播放</button><button type="button" data-act="pause">暂停</button><button type="button" data-act="replay">重播</button>
        <select data-act="speed"><option value="1">1 倍速</option><option value="0.5">0.5 倍速</option><option value="0.25">0.25 倍速</option></select></div>
      <div class="hd-row"><input type="range" min="0" max="8" step="0.01" value="0" data-act="seek"><output>0.00 s</output></div>
      <p class="hd-air"></p>
      <div class="hd-row"><label>参考图 <select data-act="ref"><option value="hero-static">hero-static</option><option value="base-before">base-before</option><option value="base-after">base-after</option></select></label>
        <label>不透明度 <input type="range" min="0" max="100" value="0" data-act="refa"></label></div>
      <div class="hd-row"><label><input type="checkbox" data-act="guides" checked> 显示声浪中线、波纹、印章和重播热区</label></div>
      <p class="hd-src"></p>
    </section>
    <section>
      <table><thead><tr><th>锚点</th><th>x %</th><th>y %</th></tr></thead><tbody>${KEYS.map(k => `
        <tr><td>${anchors[k].label}</td><td><input type="number" step="0.05" data-k="${k}" data-c="x"></td><td><input type="number" step="0.05" data-k="${k}" data-c="y"></td></tr>`).join('')}
      </tbody></table>
      <div class="hd-row"><button type="button" data-act="copy">复制 JSON</button><button type="button" data-act="reset">恢复</button><span class="hd-msg"></span></div>
      <p class="hd-note">拖动图上的圆点（或选中后按方向键，Shift 加大步长），也可以改上面的数字，画面实时更新。调好以后点“复制 JSON”，整段贴回 hero-v2/anchors.json，再运行 python3 tools/build.py 同步页面里的内嵌副本。</p>
    </section>
    <section><textarea readonly rows="9"></textarea></section>`
  document.body.append(panel)
  const $ = s => panel.querySelector(s)
  $('.hd-src').textContent = source === 'anchors.json'
    ? '锚点读自 anchors.json（改了文件刷新页面即可）'
    : 'file:// 打开读不到 anchors.json，用的是页面里的内嵌副本。用 python3 -m http.server 打开，改文件刷新就能看到。'
  if (!motion.animated) $('.hd-src').textContent += ' 现在是静态图（减少动态效果或窗口窄于 768px），动画不播。'
  const range = $('[data-act="seek"]'), out = $('output'), air = $('.hd-air')
  panel.addEventListener('input', e => {
    const t = e.target
    if (t.dataset.k) { const v = parseFloat(t.value); if (!isNaN(v)) { a[t.dataset.k][t.dataset.c] = round(v); update(false) } }
    else if (t.dataset.act === 'seek') motion.seek(parseFloat(t.value))
    else if (t.dataset.act === 'refa') ref.style.opacity = t.value / 100
    else if (t.dataset.act === 'ref') ref.src = `img/${t.value}.webp`
    else if (t.dataset.act === 'speed') motion.setSpeed(parseFloat(t.value))
    else if (t.dataset.act === 'guides') guides.style.display = t.checked ? '' : 'none'
  })
  panel.addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act
    if (act === 'play') motion.play()
    else if (act === 'pause') motion.pause()
    else if (act === 'replay') motion.replay()
    else if (act === 'reset') { a = clone(anchors); update() }
    else if (act === 'copy') copy()
  })
  ref.src = 'img/hero-static.webp'
  ref.style.opacity = 0

  function json() {
    const rows = KEYS.map(k => `  "${k}": { "label": "${a[k].label}", "x": ${round(a[k].x)}, "y": ${round(a[k].y)} }`)
    return `{\n  "说明": ${JSON.stringify(NOTE)},\n${rows.join(',\n')}\n}\n`
  }
  function copy() {
    const text = json(), msg = $('.hd-msg')
    const done = ok => { msg.textContent = ok ? '已复制' : '复制失败，请手动全选下面的文字'; setTimeout(() => { msg.textContent = '' }, 2000) }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), () => done(false))
    else { const ta = $('textarea'); ta.select(); done(document.execCommand('copy')) }
  }

  function update(syncInputs = true) {
    motion.setAnchors(a)
    for (const k of KEYS) {
      pins[k].style.left = a[k].x + '%'
      pins[k].style.top = a[k].y + '%'
      pins[k].querySelector('span').textContent = `${anchors[k].label} ${a[k].x.toFixed(2)}, ${a[k].y.toFixed(2)}`
    }
    if (syncInputs) panel.querySelectorAll('input[data-k]').forEach(i => { i.value = a[i.dataset.k][i.dataset.c] })
    $('textarea').value = json()
    drawGuides()
  }

  function drawGuides() {
    const g = motion.geometry()
    let d = ''
    for (let i = 0; i <= g.n; i += 2) d += (i ? 'L' : 'M') + g.xs[i].toFixed(1) + ' ' + g.ys[i].toFixed(1)
    const rip = [46, 73, 100].map(rx => `<ellipse cx="${g.foot.x}" cy="${g.foot.y}" rx="${rx}" ry="${rx * 0.17}"/>`).join('')
    guides.innerHTML = `<path class="hd-arch" d="${d}"/>${rip}
      <circle class="hd-mic" cx="${g.mic.x}" cy="${g.mic.y}" r="6"/>
      <g transform="translate(${g.S.x} ${g.S.y}) rotate(12) skewX(-30) scale(0.88 0.5)"><rect class="hd-seal" x="-32" y="-32" width="64" height="64"/></g>`
  }

  update()
  return {
    onFrame(t) {
      range.value = Math.max(0, t)
      out.textContent = t.toFixed(2) + ' s'
      const ids = motion.propsInAir(t)
      air.textContent = `空中道具 ${ids.length} 样` + (ids.length ? '：' + ids.join('、') : '')
    },
  }

  function el(tag, cls) { const e = document.createElement(tag); e.className = cls; return e }
}
(async () => {
  const stage = document.querySelector('.hero-stage')
  let anchors = HERO_ANCHORS, source = 'inline'
  if (location.protocol.startsWith('http')) {
    try {
      const r = await fetch('anchors.json', { cache: 'no-store' })
      if (r.ok) { anchors = await r.json(); source = 'anchors.json' }
    } catch (e) { /* 读不到就用内嵌副本 */ }
  }
  let dbg = null
  const motion = createHeroMotion(stage, anchors, { onFrame: t => dbg && dbg.onFrame(t) })
  if (new URLSearchParams(location.search).get('debug') === '1') dbg = initHeroDebug(stage, motion, anchors, source)
  window.heroMotion = motion  // 控制台里可以 heroMotion.seek(5)、heroMotion.replay()
})()
</script>
</body>
</html>
