<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 大棋：厚木棋墩，四条短腿，棋盘上只有 5 颗棋子（3 黑 2 白）。只用竹纸、素笺、松烟墨、函套青、古铜金。 -->
  <g stroke="#24231F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -12)">
    <!-- 四条短腿（后面那条被墩身挡住大半） -->
    <path d="M100 108 l0 14 l10 -3 l0 -14 z" fill="#C9A86A"/>
    <path d="M36 128 C36 136 38 144 42 148 L54 153 C51 146 50 140 50 134 Z" fill="#C9A86A"/>
    <path d="M92 152 C92 160 93 166 96 170 L106 170 C108 166 108 160 108 152 Z" fill="#C9A86A"/>
    <path d="M150 134 C150 140 149 146 146 153 L158 148 C162 144 164 136 164 128 Z" fill="#C9A86A"/>
    <!-- 墩身两个侧面（厚） -->
    <path d="M22 92 L100 126 L100 156 L22 122 Z" fill="#C9A86A"/>
    <path d="M100 126 L178 92 L178 122 L100 156 Z" fill="#C9A86A"/>
    <!-- 木纹 -->
    <path d="M30 104 C50 112 72 122 92 132 M36 116 C54 124 74 132 90 140" fill="none" stroke-width="0.9"/>
    <path d="M108 134 C128 126 150 116 170 104 M112 144 C130 136 152 126 168 116" fill="none" stroke-width="0.9"/>
    <!-- 盘面 -->
    <path d="M22 92 L100 58 L178 92 L100 126 Z" fill="#C9A86A"/>
    <!-- 棋盘格：9 × 9 道线 -->
    <g fill="none" stroke-width="0.85">
      <path d="M35 92 L100 63.7 M43.7 95.8 L108.7 67.5 M52.3 99.6 L117.3 71.3 M61 103.3 L126 75 M69.7 107.1 L134.7 78.8 M78.3 110.9 L143.3 82.6 M87 114.7 L152 86.4 M95.7 118.4 L160.7 90.1 M104.3 122.2 L169.3 93.9"/>
      <path d="M35 92 L100 120.3 M43.7 88.2 L108.7 116.5 M52.3 84.4 L117.3 112.7 M61 80.7 L126 109 M69.7 76.9 L134.7 105.2 M78.3 73.1 L143.3 101.4 M87 69.3 L152 97.6 M95.7 65.6 L160.7 93.9 M104.3 61.8 L169.3 90.1"/>
    </g>
    <!-- 5 颗棋子 -->
    <g stroke-width="1.5">
      <ellipse cx="91.3" cy="92" rx="7.4" ry="4.4" fill="#24231F"/>
      <ellipse cx="108.7" cy="99.6" rx="7.4" ry="4.4" fill="#24231F"/>
      <ellipse cx="117.3" cy="88.3" rx="7.4" ry="4.4" fill="#F8F7F2"/>
      <ellipse cx="74" cy="92" rx="7.4" ry="4.4" fill="#F8F7F2"/>
      <ellipse cx="100" cy="80.7" rx="7.4" ry="4.4" fill="#24231F"/>
    </g>
  </g>
</svg>
