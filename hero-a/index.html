<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>咸鱼把脉了 招牌插画原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root{
  --paper:#ECEAE1;--sheet:#F8F7F2;--ink:#24231F;--ink-2:#4E4C45;
  --indigo:#1F3A4D;--cinnabar:#B5382A;
  /* 招牌插画追加的四种颜色 */
  --skin:#EDCAB1;--hair:#3B3A37;--gray:#5B5A55;--mount:#DACCB8;
  --kai:"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif;
  --song:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--song);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}

/* hero-signboard:start（到 end 之间的样式由 tools/build.py 原样复制进 HeroSignboard.vue；类名带 hero- 前缀，不和全站的 .plaque 冲突） */
/* ---------- 招牌：插画铺满，牌匾和标语压在中间偏左的空白墙面上（约 37%–58%） ---------- */
.hero-signboard{position:relative;max-width:1920px;margin:0 auto;container-type:inline-size}
.hero-signboard .hero-art{display:block;width:100%;height:auto}
/* 招牌滚出视口时由脚本加上 hero-paused，动效停在当前帧；插画内部的 animation 简写会把它重置成 running，所以加 !important */
.hero-art.hero-paused *{animation-play-state:paused!important}
.hero-sign{position:absolute;left:47.5%;top:6.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-plaque{display:inline-block;margin:0;padding:.41em 1.18em;background:var(--indigo,#1F3A4D);color:#F4F2EA;font-family:var(--kai,"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif);font-weight:400;font-size:clamp(20px,2.36vw,45px);font-size:clamp(20px,2.36cqi,45px);line-height:1.7;white-space:nowrap;box-shadow:inset 0 0 0 5px var(--indigo,#1F3A4D),inset 0 0 0 6px #C9A86A}
.hero-plaque span{letter-spacing:.35em;margin-right:-.35em}
.hero-motto{margin:.85em 0 0;font-family:var(--kai,"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif);font-size:clamp(13px,1.25vw,24px);font-size:clamp(13px,1.25cqi,24px);line-height:1.8;letter-spacing:.12em;color:var(--ink-2,#4E4C45);white-space:nowrap}
.hero-motto span{display:block}

/* ---------- 窄屏：牌匾和标语移到插画上方，插画等比缩小 ---------- */
@media (max-width:960px){
  .hero-sign{position:static;transform:none;padding:28px 16px 0}
  .hero-plaque{font-size:24px;padding:10px 22px}
  .hero-motto{margin-top:12px;font-size:15px;letter-spacing:.1em}
}
/* hero-signboard:end */
</style>
</head>
