# Dedicated hostname for phone/IPv6-only-network compatibility.
server {
    listen 80;
    server_name xianyu.182.61.30.47.sslip.io;
    location /.well-known/acme-challenge/ { root /opt/xianyu-bamai/shared/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name xianyu.182.61.30.47.sslip.io;
    ssl_certificate /etc/letsencrypt/live/tempdesign-preview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tempdesign-preview/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/tempdesign-preview/current;
    index index.html;
    autoindex off;
    # Explicit MIME table, including ES modules and module Workers.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/gif gif;
        image/x-icon ico;
        font/woff2 woff2;
        audio/mpeg mp3;
        video/mp4 mp4;
        video/webm webm;
        text/plain txt md;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    location = / { return 302 /home-pano/; }
    location / { try_files $uri $uri/ =404; }
    access_log /var/log/nginx/tempdesign-preview.access.log;
    error_log /var/log/nginx/tempdesign-preview.error.log;
}
