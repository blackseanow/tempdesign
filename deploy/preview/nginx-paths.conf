# Include inside the existing HTTPS server for 182.61.30.47.
# Only these prefixes are routed to the separate static release.
location = /home-pano { return 302 /home-pano/; }
location ^~ /home-pano/ {
    root /var/www/tempdesign-preview/current;
    include /etc/nginx/snippets/tempdesign-preview-types.conf;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /anatomy { return 302 /anatomy/; }
location ^~ /anatomy/ {
    root /var/www/tempdesign-preview/current;
    include /etc/nginx/snippets/tempdesign-preview-types.conf;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
