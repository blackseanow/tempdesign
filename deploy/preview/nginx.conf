# Independent static preview. Loopback 127.0.0.1:8000 remains the existing backend.
# This host is NATed: 182.61.30.47 -> 192.168.0.2.
server {
    listen 192.168.0.2:8000 ssl;
    server_name 182.61.30.47;
    ssl_certificate /etc/letsencrypt/live/182.61.30.47/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/182.61.30.47/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/tempdesign-preview/current;
    index index.html;
    autoindex off;
    # Explicit MIME table, including ES modules and module Workers.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/gif gif;
        image/x-icon ico;
        font/woff2 woff2;
        audio/mpeg mp3;
        video/mp4 mp4;
        video/webm webm;
        text/plain txt md;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    location = / { return 302 /home-pano/; }
    location / { try_files $uri $uri/ =404; }
    access_log /var/log/nginx/tempdesign-preview.access.log;
    error_log /var/log/nginx/tempdesign-preview.error.log;
}
