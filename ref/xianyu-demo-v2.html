<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>咸鱼把脉了 设计稿 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css">
<style>
:root{
  --paper:#ECEAE1;--sheet:#F8F7F2;--ink:#24231F;--ink-2:#4E4C45;--ink-3:#6B685F;
  --line:#D6D2C4;--line-2:#E4E0D4;
  --indigo:#1F3A4D;--indigo-2:#2B4D65;--cinnabar:#B5382A;--brass:#85682F;
  --velvet:#A72F24;--gold:#D9B865;--wood:#6B4A2B;
  --kai:"LXGW WenKai","KaiTi","STKaiti","BiauKai",serif;
  --song:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--song);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--kai);font-weight:400}

/* ---------- 骨架 ---------- */
.shell{display:grid;grid-template-columns:78px minmax(0,1fr);min-height:100vh}
.main{min-width:0}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0 14px;background:var(--indigo)}
.tiqian{writing-mode:vertical-rl;font-family:var(--kai);font-size:21px;letter-spacing:.3em;color:var(--ink);background:var(--sheet);padding:14px 8px;box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 4px #A79F88}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.nav button,.rail .admin{position:relative;writing-mode:vertical-rl;font-family:var(--kai);font-size:17px;letter-spacing:.2em;background:none;border:0;color:rgba(236,234,225,.62);padding:12px 14px}
.nav button:hover,.rail .admin:hover{color:#F4F2EA}
.rail [aria-current="page"]{color:#fff}
.rail [aria-current="page"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:#C9A86A}
.view{display:none}
.view.on{display:block}
.page{max-width:1040px;margin:0 auto;padding:36px 36px 72px}
.page>h1{font-size:30px}
.lead{margin:6px 0 24px;color:var(--ink-2);max-width:42em}
.note{min-height:1.7em;margin:12px 0 0;font-size:14px;color:var(--brass)}
.ph{max-width:34em;padding:64px 40px;font-family:var(--kai);font-size:20px;color:var(--ink-2)}

/* ---------- 按钮 ---------- */
.btn{border:1px solid var(--ink-3);background:var(--sheet);padding:6px 14px;border-radius:2px;font-size:14px;line-height:1.6}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#F4F2EA}
.btn.primary:hover{background:var(--indigo-2);border-color:var(--indigo-2)}
.btn:disabled{opacity:.45}
.btn.ghost,.link{background:none;border:0;padding:6px 0;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:4px}
.link{padding:0;color:var(--indigo)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px}

/* ---------- 医馆大堂 ---------- */
.plaque{display:inline-block;padding:14px 40px;background:var(--indigo);color:#F4F2EA;box-shadow:inset 0 0 0 5px var(--indigo),inset 0 0 0 6px #C9A86A}
.plaque span{font-size:34px;letter-spacing:.35em;margin-right:-.35em}
.greet{margin:14px 0 26px;color:var(--ink-2)}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.door{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 18px 20px;background:var(--sheet);border:1px solid var(--line)}
.door:hover{border-color:var(--ink)}
.door-plaque{align-self:stretch;margin:0 -18px 14px;padding:10px 0 10px .3em;background:var(--indigo);color:#F4F2EA;font-family:var(--kai);font-size:22px;letter-spacing:.3em}
.door .il{max-width:170px;height:136px}
.door .flag{--fs:4.7px}
.door-desc{display:block;margin:10px 0;color:var(--ink-2);font-size:14px}
.door-go{font-family:var(--kai);font-size:16px;color:var(--indigo);text-decoration:underline;text-underline-offset:5px}
.inward{margin-top:36px}
.inward h2{font-size:22px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px 18px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.row-t b{display:block;font-family:var(--kai);font-weight:400;font-size:18px}
.row-t span{font-size:13px;color:var(--ink-2)}
.row-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.state{white-space:nowrap;font-family:var(--kai);font-size:14px;line-height:24px;padding:0 8px;border:1px solid var(--indigo);color:var(--indigo)}
.state.closed{border-color:var(--cinnabar);color:var(--cinnabar)}
.empty{display:flex;align-items:center;gap:18px;padding:12px 0;color:var(--ink-2)}
.empty .il{width:110px;flex:none}
.tip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin-bottom:8px;padding:12px 16px;background:var(--sheet);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.tip p{margin:0}

/* ---------- 诊程 ---------- */
.case-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding:22px 36px 14px;border-bottom:1px solid var(--line)}
.case-title{display:flex;align-items:center;gap:12px}
.case-title h1{font-size:26px;line-height:1.3}
.round{font-family:var(--kai);font-size:15px;line-height:24px;padding:0 8px;color:var(--cinnabar);border:1px solid var(--cinnabar)}
.stepper{display:flex;list-style:none;margin:0;padding:0}
.stepper li{display:flex;align-items:center}
.stepper li+li::before{content:"";width:34px;height:1px;margin:0 6px;background:var(--line)}
.stepper li.done+li::before{background:var(--ink-2)}
.stepper button{display:grid;justify-items:center;padding:4px 6px;background:none;border:0;color:var(--ink-3)}
.stepper b{font-family:var(--kai);font-weight:400;font-size:19px;letter-spacing:.1em;border-bottom:2px solid transparent}
.stepper small{font-size:12px;line-height:1.5}
.stepper .done button{color:var(--ink-2)}
.stepper .cur button{color:var(--indigo)}
.stepper .cur b{border-bottom-color:var(--indigo)}
.step{display:none}
.step.on{display:block}
.base-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:10px 36px;background:var(--sheet);border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.base-bar b{font-weight:600;color:var(--ink)}
.p-ctrl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:14px 36px}
.c-meta{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:14px;color:var(--ink-2)}
.c-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.rec{display:inline-flex;align-items:center;gap:8px;font-family:var(--kai);font-size:16px;color:var(--cinnabar)}
.rec b{font-weight:400}
.rec i{width:9px;height:9px;background:var(--cinnabar)}
.rec.off{color:var(--ink-3)}
.rec.off i{background:var(--ink-3)}
.timer{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-right:6px}
.pulse{display:block;width:100%;height:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pulse polyline{fill:none;stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke}
.c-body{display:grid;grid-template-columns:minmax(0,1fr) 360px}
.maian{min-height:60vh;padding:10px 36px 96px;border-right:1px solid var(--line)}
.u{display:grid;grid-template-columns:48px 112px minmax(0,1fr);gap:0 14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.u .t{padding-top:4px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.u .who{display:flex;align-items:flex-start;gap:8px;padding-top:2px;font-family:var(--kai);font-size:16px;color:var(--ink-2)}
.u .who.pending{font-size:14px;color:var(--ink-3)}
.seal{flex:none;display:grid;place-items:center;width:30px;height:30px;margin-top:-2px;border:2px solid var(--cinnabar);color:var(--cinnabar);font-size:18px;line-height:1}
.u .say{margin:0;font-size:16px;line-height:1.9;color:var(--ink-2)}
.u.leader .who,.u.leader .say{color:var(--ink)}
.u.partial .say{color:var(--ink-3)}
.u.note .who{color:var(--brass)}
.u.note .say{font-size:14px}
.mark-req{text-decoration:underline;text-decoration-color:var(--cinnabar);text-decoration-thickness:1px;text-underline-offset:6px}
.mark-req sup{margin-left:1px;font-family:var(--kai);font-size:12px;color:var(--cinnabar)}
.u.flash .say{animation:flash 1.8s ease-out}
@keyframes flash{from{background:#EBDCD3}to{background:transparent}}
.maixiang{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:18px 22px 28px}
.mx-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.mx-head h2{font-size:22px}
.mx-head p{margin:0;font-size:14px;color:var(--ink-2)}
.mx-toggle{display:none}
.mx-sub{margin:10px 0 14px;font-size:13px;color:var(--ink-2)}
.mx-empty{font-size:14px;color:var(--ink-3)}
.slip{margin-bottom:10px;padding:12px 14px 10px;background:var(--sheet);border:1px solid var(--line);border-left:2px solid var(--cinnabar)}
.slip.unsure{border-left-color:var(--brass)}
.slip.new{animation:ink 1.6s ease-out}
@keyframes ink{from{background:#EFDDD4}to{background:var(--sheet)}}
.slip p{margin:0 0 8px;font-size:15px;line-height:1.75}
.slip .no,.rx .no{font-family:var(--kai);color:var(--cinnabar)}
.slip .no{margin-right:6px;font-size:17px}
.slip.unsure .no,.rx li.unsure .no{color:var(--brass)}
.upd{margin-left:6px;font-family:var(--kai);font-size:13px;color:var(--brass)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--ink-2)}
.tag{padding:0 6px;font-family:var(--kai);font-size:13px;line-height:20px;border:1px solid var(--ink-3)}
.ask{font-style:normal;color:var(--brass)}
.src{padding:0;background:none;border:0;font-size:13px;color:var(--indigo);text-decoration:underline;text-underline-offset:3px}
.mx-foot{margin-top:14px}

/* ---------- 开方、治疗 ---------- */
.rx-wrap,.cure{padding:32px 24px 72px}
.rx,.sheet{max-width:800px;margin:0 auto;padding:40px 52px 34px;background:var(--sheet);border:1px solid #CFCABA}
.rx-top{display:flex;align-items:flex-end;gap:40px;padding-bottom:14px;border-bottom:3px double var(--ink)}
.rx-top h1{font-size:46px;line-height:1;letter-spacing:.24em}
.rx-info{flex:1;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.rx-info dt{color:var(--ink-3)}
.rx-info dd{margin:0}
.rx h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 8px;font-size:21px}
.rx h2 small{font-family:var(--song);font-size:13px;color:var(--ink-3)}
.rx ol{list-style:none;margin:0;padding:0}
.rx li{display:grid;grid-template-columns:22px 28px minmax(0,1fr);gap:0 8px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.rx li input{width:15px;height:15px;margin:7px 0 0;accent-color:var(--indigo)}
.rx li .no{font-size:19px;line-height:1.6}
.rx li p{margin:0 0 4px;font-size:16px;line-height:1.8}
.rx li:not(:has(input:checked)) p{color:var(--ink-3)}
.file{display:flex;align-items:center;gap:14px;padding:12px 14px;background:#FBFAF6;border:1px solid var(--line)}
.file+.file{margin-top:8px}
.fbadge{flex:none;display:grid;place-items:center;width:34px;height:40px;background:var(--indigo);color:#F4F2EA;font-family:var(--kai);font-size:18px}
.fbadge.ppt{background:var(--brass)}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-weight:600;overflow-wrap:anywhere}
.fmeta span{font-size:13px;color:var(--ink-2)}
.yizhu{display:block;width:100%;min-height:290px;padding:0 14px;border:1px solid var(--line);border-radius:0;resize:vertical;font-size:15px;line-height:32px;color:var(--ink);background-color:#FBFAF6;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line-2) 31px 32px);background-attachment:local}
.rx-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:22px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.choose{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:14px}
.choose .lbl{font-family:var(--kai);font-size:18px}
.opt{display:inline-flex;align-items:center;gap:6px}
.opt input{accent-color:var(--indigo)}
.choose select{padding:4px 8px;border:1px solid var(--ink-3);border-radius:2px;background:var(--sheet);font-size:14px}
.fixed-cure{color:var(--ink-2)}
.sign{display:flex;align-items:center;gap:18px}
.signer{position:relative;display:grid;text-align:right;font-size:13px;color:var(--ink-2)}
.signer b{font-family:var(--kai);font-weight:400;font-size:20px;color:var(--ink)}
.seal-btn{flex:none;display:grid;place-items:center;width:76px;height:76px;writing-mode:vertical-rl;letter-spacing:.14em;font-family:var(--kai);font-size:24px;color:var(--cinnabar);background:var(--sheet);border:2px solid var(--cinnabar);border-radius:2px;box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 4px var(--cinnabar)}
.seal-btn:hover{background:#F5E8E3}
.stamp{position:absolute;right:calc(100% + 12px);top:-6px;display:grid;place-items:center;width:58px;height:58px;writing-mode:vertical-rl;letter-spacing:.06em;font-family:var(--kai);font-size:21px;color:var(--cinnabar);border:2px solid var(--cinnabar);opacity:0;transform:rotate(-6deg) scale(1.35);transition:opacity .18s ease-out,transform .18s ease-out;pointer-events:none}
.stamp.on{opacity:.92;transform:rotate(-6deg) scale(1)}
.rx-status{min-height:1.7em;margin:12px 0 0;text-align:right;font-size:14px;color:var(--ink-2)}
.sheet h2{font-size:26px}
.hint{margin:4px 0 16px;font-size:14px;color:var(--ink-2)}
.outline{list-style:none;margin:0;padding:0}
.outline li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.outline b{font-family:var(--kai);font-weight:400;font-size:18px}
.outline span{font-size:13px;color:var(--ink-3)}
.boil,.ready{display:grid;justify-items:center;text-align:center}
.boil{padding:20px 0 10px}
.boil .il{width:200px}
.boil p{margin:4px 0 0;color:var(--ink-2)}
.boil .boil-t{margin-top:8px;font-family:var(--kai);font-size:22px;color:var(--ink)}
.ready{margin-bottom:18px}
.ready .il{width:170px}
.chg{padding:14px 0;border-bottom:1px solid var(--line-2)}
.chg-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px}
.chg-h b{font-family:var(--kai);font-weight:400;font-size:17px}
.chg-h span{font-size:13px;color:var(--ink-3)}
.chg del{display:block;margin-top:6px;color:var(--ink-3);text-decoration-color:var(--cinnabar)}
.chg ins{display:block;margin-top:4px;text-decoration:underline;text-decoration-color:var(--indigo);text-underline-offset:5px}
.chg.off ins{color:var(--ink-3);text-decoration-color:var(--line)}
.seg{display:inline-flex;margin-top:10px;border:1px solid var(--ink-3)}
.seg button{padding:2px 12px;background:none;border:0;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--indigo);color:#F4F2EA}

/* ---------- 交差：锦旗 ---------- */
.trophy{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:32px 52px;max-width:980px;margin:0 auto;padding:32px 36px 72px}
.trophy-flag{display:grid;justify-items:center;gap:6px}
.trophy .flag{--fs:12px}
.trophy-info h2{font-size:30px}
.trophy-info h3{margin:24px 0 8px;padding-bottom:6px;font-size:19px;border-bottom:1px solid var(--line)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:0 12px;padding:6px 0}
.timeline b{font-family:var(--kai);font-weight:400;font-size:17px;color:var(--cinnabar)}
.timeline span{font-size:14px;color:var(--ink-2)}
.flag{--fs:10px;display:inline-flex;flex-direction:column;align-items:center;font-size:var(--fs)}
.flag-top{display:block;width:17.5em;height:4em}
.flag-body{display:flex;flex-direction:column;justify-content:space-between;width:15em;height:22.5em;margin-top:-.3em;padding:1.4em 1.1em;writing-mode:vertical-rl;background:var(--velvet);color:var(--gold);font-family:var(--kai);box-shadow:inset 0 0 0 .45em var(--velvet),inset 0 0 0 .55em var(--gold)}
.flag-to,.flag-from{font-size:1.15em;line-height:1.3;letter-spacing:.15em}
.flag-to{align-self:flex-start}
.flag-from{align-self:flex-end}
.flag-word{align-self:center;font-size:3.6em;line-height:1;letter-spacing:.18em}
.flag-fringe{width:15em;height:2.4em;border-top:.25em solid var(--gold);background:repeating-linear-gradient(90deg,var(--gold) 0 .16em,transparent .16em .5em)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 18px}
.wall-item{display:grid;justify-items:center;gap:4px;padding:12px 6px;background:none;border:0;text-align:center}
.wall-item .flag{--fs:7px;margin-bottom:8px}
.wall-item b{font-family:var(--kai);font-weight:400;font-size:17px}
.wall-item:hover b{color:var(--indigo)}
.wall-item .cap{font-size:13px;color:var(--ink-2)}

/* ---------- 插画 ---------- */
.il{display:block;width:100%;height:auto;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.il .f-sheet{fill:var(--sheet)}
.il .f-paper{fill:var(--paper)}
.il .f-indigo{fill:var(--indigo)}
.il .f-ink{fill:var(--ink)}
.il .f-red{fill:var(--cinnabar);stroke:none}
.il .s-red{stroke:var(--cinnabar)}
.il .s-sheet{stroke:var(--sheet)}
.il .thin{stroke-width:1}
.il .bold{stroke-width:2.6}
.il .t-seal{fill:var(--sheet);stroke:none;font-family:var(--kai)}
.il .steam{opacity:0;animation:il-steam 2.8s ease-in-out infinite}
.il .steam.d2{animation-delay:.9s}
.il .steam.d3{animation-delay:1.8s}
@keyframes il-steam{0%{opacity:0;transform:translateY(6px)}35%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.il .steam{opacity:1}}

/* ---------- H5 ---------- */
@media (max-width:820px){
  .shell{display:block}
  .rail{position:fixed;inset:auto 0 0 0;z-index:30;height:auto;flex-direction:row;gap:0;padding:0 0 env(safe-area-inset-bottom);overflow:visible}
  .tiqian,.desk{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%;gap:0}
  .nav button{flex:1;writing-mode:horizontal-tb;padding:13px 0 12px;font-size:15px;letter-spacing:.06em}
  .rail [aria-current="page"]::before{left:32%;right:32%;top:0;bottom:auto;width:auto;height:2px}
  .main{padding-bottom:calc(52px + env(safe-area-inset-bottom))}
  .page{padding:20px 16px 40px}
  .plaque{padding:10px 22px}
  .plaque span{font-size:24px}
  .doors{grid-template-columns:1fr;gap:12px}
  .door{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-areas:"pl pl" "ill desc" "ill go";align-items:center;column-gap:14px;padding:0 14px 12px;text-align:left}
  .door-plaque{grid-area:pl;margin:0 -14px 10px;font-size:19px;text-align:center}
  .door .il,.door .flag{grid-area:ill;justify-self:center}
  .door .il{width:96px;height:auto}
  .door .flag{--fs:3.4px}
  .door-desc{grid-area:desc;margin:0}
  .door-go{grid-area:go;align-self:start}

    } else {
      const n = S.accepted.filter(Boolean).length;
      const name = rv ? `${DOC}第2版（带修订痕迹）.docx` : `${DOC}第1版.docx`;
      const meta = rv ? `Word　采纳 ${n} 处修订　刚刚生成` : 'Word　9 页　刚刚生成';
      const extra = rv
        ? `<button class="btn ghost" data-act="demo-only" data-msg="${FILE_MSG}">与第1版对比</button>`
        : '<button class="btn ghost" data-act="demo-only" data-msg="正式版可以在同一病例下再开一方，出 PPT 汇报材料。">再开一方：出 PPT 汇报材料</button>';
      html = `<div class="ready">${IL.pack}<h2>药已备好</h2></div><div class="file"><span class="fbadge">文</span><span class="fmeta"><b>${name}</b><span>${meta}</span></span><button class="link" data-act="demo-only" data-msg="${FILE_MSG}">预览</button><button class="link" data-act="demo-only" data-msg="${FILE_MSG}">下载</button></div><div class="actions"><button class="btn primary" data-act="deliver">交差</button>${extra}</div><p class="note" data-note></p>`;
    }
    $('#cure').innerHTML = `<div class="sheet">${html}</div>`;
  }
  function boil() {
    S.cure = 'boiling';
    renderCure(); renderStepper();
    const steps = S.mode === 'revisit'
      ? ['正在修订 责任分工', '正在修订 时间安排', '正在补写 风险提示'].filter((_, i) => S.accepted[i])
      : ['正在拟写 总体要求', '正在拟写 整改任务', '正在拟写 责任分工', '正在拟写 时间安排', '正在拟写 保障措施'];
    let k = 0;
    const tick = () => {
      if (S.cure !== 'boiling') return;
      if (k < steps.length) {
        const el = $('#boil-step');
        if (el) el.textContent = steps[k];
        k++;
        setTimeout(tick, reduce ? 0 : 700);
      } else {
        S.cure = 'ready';
        if (S.step === 'cure') renderCure();
        renderStepper();
      }
    };
    tick();
  }
  function deliver() {
    S.active = false;
    if (S.mode === 'first') { S.aRound = 1; S.phrase = 0; }
    else { S.aRound = 2; S.phrase = 1; S.taken = S.accepted.filter(Boolean).length; S.revSkipped = S.skipped; }
    goStep('done');
  }

  /* ========== 交差：锦旗与成果 ========== */
  function renderTrophy(el, c, inFlow) {
    const files = c.files.map(n => {
      const ppt = n.endsWith('.pptx');
      return `<div class="file"><span class="fbadge${ppt ? ' ppt' : ''}">${ppt ? '演' : '文'}</span><span class="fmeta"><b>${n}</b><span>${ppt ? 'PPT' : 'Word'}</span></span><button class="link" data-act="demo-only" data-msg="${FILE_MSG}">下载</button></div>`;
    }).join('');
    let again = '<button class="btn" data-act="demo-only">领导又有意见？发起复诊</button>';
    if (c.id === 'a') again = S.active ? '' : '<button class="btn" data-act="revisit-a">领导又有意见？发起复诊</button>';
    el.innerHTML = `<div class="trophy">
      <div class="trophy-flag">${flagHTML(c)}${c.id === 'a' ? '<button class="btn ghost" data-act="phrase">换一句</button>' : ''}</div>
      <div class="trophy-info">
        <h2>把脉成功，交差了</h2>
        <p class="lead">${c.title}，${c.round}交差。${inFlow ? '这面锦旗已挂上锦旗墙。' : ''}</p>
        <h3>成果</h3>${files}
        <h3>诊疗经过</h3>
        <ol class="timeline">${c.timeline.map(([r, d, t]) => `<li><b>${r}</b><span>${d}　${t}</span></li>`).join('')}</ol>
        <div class="actions"><button class="btn primary" data-act="demo-only" data-msg="${FILE_MSG}">下载全部成果</button>${again}<button class="btn ghost" data-go="${inFlow ? 'home' : 'wall'}">${inFlow ? '回医馆' : '回锦旗墙'}</button></div>
        <p class="note" data-note></p>
      </div>
    </div>`;
  }
  function cyclePhrase() {
    S.phrase = (S.phrase + 1) % PHRASES.length;
    if (vCase.classList.contains('on')) renderTrophy($('#done'), caseA(), true);
    else renderTrophy($('#trophy-view'), caseA(), false);
  }

  /* ========== 交互 ========== */
  function closeSheet() {
    sheet.classList.remove('open');
    $('#mx-toggle').setAttribute('aria-expanded', 'false');
    $('#mx-state').textContent = '展开';
  }
  function note(btn, msg) {
    const box = btn.closest('.sheet, .trophy-info, .page, .rx');
    const el = box && box.querySelector('[data-note], .rx-status');
    if (el) el.textContent = msg;
  }
  function goSrc(t) {
    goStep('pulse');
    const row = [...maian.querySelectorAll('.u:not(.note)')].find(r => r.querySelector('.t').textContent === t);
    if (!row) return;
    row.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  }

  document.addEventListener('click', e => {
    const t = e.target;
    let el;
    if ((el = t.closest('[data-go]'))) return show(el.dataset.go);
    if ((el = t.closest('[data-stepgo]'))) return goStep(el.dataset.stepgo);
    if ((el = t.closest('[data-trophy]'))) { renderTrophy($('#trophy-view'), getCase(el.dataset.trophy), false); return show('trophy'); }
    if ((el = t.closest('[data-src]'))) return goSrc(el.dataset.src);
    if (!(el = t.closest('[data-act]'))) return;
    switch (el.dataset.act) {
      case 'start': startFlow('first'); break;
      case 'revisit-a': startFlow('revisit'); break;
      case 'quick-revisit': S.aRound = Math.max(S.aRound, 1); startFlow('revisit'); break;
      case 'pulse-done': finishPulse(); goStep('rx'); break;
      case 'skip-pulse': skipPulse(); break;
      case 'sign': sign(); break;
      case 'to-cure': goStep('cure'); break;
      case 'boil': boil(); break;
      case 'accept': S.accepted[+el.dataset.i] = el.dataset.v === '1'; renderCure(); break;
      case 'deliver': deliver(); break;
      case 'phrase': cyclePhrase(); break;
      case 'demo-only': note(el, el.dataset.msg || DEMO_MSG); break;
    }
  });
  $('#btn-pause').addEventListener('click', () => setPaused(!paused));
  $('#btn-replay').addEventListener('click', () => { if (S.active) resetSim(); });
  $('#btn-mark').addEventListener('click', () => {
    const s = elapsed();
    const n = document.createElement('div');
    n.className = 'u note';
    n.innerHTML = `<span class="t">${pad(Math.floor(s / 60))}:${pad(s % 60)}</span><span class="who">要紧</span><p class="say">已在此处打点，开方时优先参考这一段。</p>`;
    maian.appendChild(n);
    follow(n);
  });
  $('#mx-toggle').addEventListener('click', () => {
    const open = sheet.classList.toggle('open');
    $('#mx-toggle').setAttribute('aria-expanded', String(open));
    $('#mx-state').textContent = open ? '收起' : '展开';
  });

  /* ========== 启动 ========== */
  $('#door-flag').outerHTML = flagHTML({ phrase: '交差圆满', from: '王建国敬赠', month: '二〇二六年十月' });
  renderHome();
  if (reduce) drawStatic();
  else { last = performance.now(); requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
