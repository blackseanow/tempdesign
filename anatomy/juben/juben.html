function coverHull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  for (const p of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();

  for (let i = sorted.length - 1; i >= 0; i--) {

function coverSolid(F, P) {

function coverFace(F, side, P) {

// every other part (C.keys over 0..C.open), with the acts at home, and apart once the cover is most of
// the way round. Up to C.flip, where the board turns edge-on to the reader, its outside shows and every
// act lies behind it; past C.flip its inside shows, with the acts in front. So the nearest measured
// angle on the same side of C.flip gives its key among the fixed parts, and while its outside shows it
// also goes over the acts' live keys (actTop, the highest), however far out they still are.
function coverKeyOf(theta, C, actTop) {

// u across the opening, v up, w toward the audience, all in the curtain's own plane (millimetres).
// Each half hangs in `pleats` pleats of two panels each, with `slack` more cloth than its width, so
// even drawn shut it folds a little. Drawn open it gathers against its side: the run of pleats gets

const curtainUnit = (a) => {
  const length = Math.hypot(a[0], a[1], a[2]) || 1;

// The fold line positions of one half, in the curtain plane: [u, w] from the middle edge to the
// side edge. `side` is -1 for the left half and 1 for the right; `open` runs 0 (closed) to 1.
function curtainFolds(half, side, open) {
  const n = CURTAIN.pleats * 2;
  const panel = (half / n) * CURTAIN.slack;
  const span = half * (1 - CURTAIN.gather * open);
  const step = span / n;
  const depth = Math.sqrt(Math.max(0, panel * panel - step * step));
  const points = [];
  for (let i = 0; i <= n; i++) points.push([side * (half - span + i * step), i % 2 ? depth / 2 : -depth / 2]);
  return points;
}

// The panels of one half as paths, painted back to front, each in the kit's four shades by how
// it faces the light. F: { o, u, v, w } places the curtain's plane in the world (o at the middle
// of the rod), top and bottom are v of the rod and of the hem.
function curtainPaths(F, half, side, open, top, bottom, P) {
  const V = curtainView(P);
  const L = curtainLight(P);
  const at = ([u, w], v) => [F.o[0] + F.u[0] * u + F.v[0] * v + F.w[0] * w, F.o[1] + F.u[1] * u + F.v[1] * v + F.w[1] * w, F.o[2] + F.u[2] * u + F.v[2] * v + F.w[2] * w];
  const folds = curtainFolds(half, side, open);
  // the hem rises a little at every fold that points back, so the bottom edge reads as cloth
  const hemOf = (index) => bottom + (index % 2 ? 0 : CURTAIN.sag * (0.4 + 0.6 * open));
  const panels = [];
  for (let i = 0; i < folds.length - 1; i++) {
    const a = folds[i];
    const b = folds[i + 1];
    const quad = [at(a, top), at(b, top), at(b, hemOf(i + 1)), at(a, hemOf(i))];
    const du = b[0] - a[0];
    const dw = b[1] - a[1];
    // the panel's normal toward the audience side; cloth is seen from either side
    let normal = curtainUnit([F.w[0] * du - F.u[0] * dw, F.w[1] * du - F.u[1] * dw, F.w[2] * du - F.u[2] * dw]);
    if (curtainDot(normal, V) < 0) normal = normal.map((value) => -value);
    const centre = quad.reduce((sum, p) => [sum[0] + p[0] / 4, sum[1] + p[1] / 4, sum[2] + p[2] / 4], [0, 0, 0]);
    panels.push({ d: pathOf(quad.map((p) => iso(p, P)), true), shade: curtainBand(curtainDot(normal, L)), depth: curtainDot(centre, V) });
  }
  // each panel is filled and stroked on its own, back to front, so a nearer panel hides the folds
  // behind it and the hem is the run of the panels' bottom edges
  panels.sort((x, y) => x.depth - y.depth);
  return panels;
}

  D.acts.forEach((_, index) => {
    drawTag(index);
    drawCurtain(index);
  });
  const parts = tally();
  const text = readoutOf(parts);
  if (text !== shownReadout) {
    shownReadout = text;
    readoutCount.textContent = countOf(parts);
    readoutShare.textContent = shareOf(parts);
  }
}

function settledPhase() {
  const resting = SLOTS.every((id) => !slot[id].pending && slot[id].x === slot[id].target);
  if (!resting) return;
  const parts = tally();
  if (apart) announce(`五幕都拉开了。${readoutOf(parts)}：两个小时里，真正要记下来的只有要求那五分钟。`);
  else announce(`剧本已合上。${readoutOf(parts)}。`);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  let moving = false;
  SLOTS.forEach((id) => {
    const s = slot[id];
    if (s.pending && clock >= s.pending.at) (s.target = s.pending.value), (s.pending = null);
    if (s.pending) moving = true;
    if (step(s, s.target, dt, D.spring.stiffness, D.spring.damping)) moving = true;
  });
  // each tag turns with its curtain: the act's line shows once its curtain parts
  D.acts.forEach((_, index) => {
    if (step(flip[index], slot[CURTAIN_IDS[index]].target, dt, 22, 9.4)) moving = true;
  });
  draw();
  settledPhase();
  frame = visible && moving ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function jump(value) {
  // reduced motion: no springs; the picture is the one the motion would end on
  for (const id of SLOTS) Object.assign(slot[id], { x: value, v: 0, target: value, pending: null });
  flip.forEach((f) => Object.assign(f, { x: value, v: 0 }));
  apart = Boolean(value);
  stage.setAttribute("aria-pressed", String(apart));
  draw();
}

function calmChanged() {
  if (still.matches) jump(1);
  else jump(0);
}

stage.addEventListener("pointerenter", (event) => event.pointerType !== "touch" && setApart(true));
stage.addEventListener("pointerleave", (event) => event.pointerType !== "touch" && setApart(false));
stage.addEventListener("pointerdown", (event) => event.pointerType === "touch" && setApart(!apart));
stage.addEventListener("keydown", (event) => {
  let to = null;
  if (event.key === " " || event.key === "Enter") to = !apart;
  if (event.key === "Escape" || event.key === "ArrowDown") to = false;
  if (event.key === "ArrowUp") to = true;
  if (to === null) return;
  event.preventDefault();
  setApart(to);
});
stage.addEventListener("focus", () => settledPhase());
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener("change", calmChanged);
stage.setAttribute("aria-pressed", "false");
if (still.matches) jump(1);
else draw();
</script></body></html>
